# Vercel baut über die GitHub-Integration nur Commits, deren Autor Zugriff auf das Vercel-Projekt
# hat; Pushes anderer Konten werden ignoriert. Dieser Workflow stößt deshalb nach jedem Push auf den
# Hauptbranch einen Vercel Deploy Hook an, der unabhängig vom Commit-Autor deployt.
#
# Vorlage aus ks-overview/templates/vercel-redeploy.yml; Einrichtung über scripts/setup-vercel-redeploy.sh.
# Benötigtes Secret: VERCEL_DEPLOY_HOOK_URL (Vercel → Projekt → Settings → Git → Deploy Hooks,
# Branch = Hauptbranch).
name: Vercel redeploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel Deploy Hook aufrufen
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL fehlt (Vercel → Settings → Git → Deploy Hooks)"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
